name: Update applied PR list

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lab branch history (read-only deploy key)
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LAB_DEPLOY_KEY" > ~/.ssh/lab_key
          chmod 600 ~/.ssh/lab_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND='ssh -i ~/.ssh/lab_key -o IdentitiesOnly=yes' \
            git clone --bare --filter=blob:none --single-branch --branch lab \
            git@github.com:Caw-Lab/Caw.git "$RUNNER_TEMP/lab.git"
          rm -f ~/.ssh/lab_key

      - name: Generate README
        run: bash scripts/make-readme.sh "$RUNNER_TEMP/lab.git" > README.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update applied upstream PR list"
          git push
